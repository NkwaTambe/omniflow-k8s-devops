replicaCount: 1

image:
  tag: dev

config:
  NODE_ENV: development

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

autoscaling:
  minReplicas: 1
  maxReplicas: 3

ingress:
  hosts:
    - host: omniflow.dev.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: omniflow-dev-tls
      hosts:
        - omniflow.dev.local
