{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omniflow-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniflow-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omniflow-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: omniflow-platform
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: kube-system
      ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
{{- end }}
